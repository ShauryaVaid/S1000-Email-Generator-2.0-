# AI Email Generator Configuration

# Provider Selection: gemini (default cloud) or ollama (local)
provider: gemini

# Gemini Configuration (Default Cloud Engine)
gemini:
  api_key: ""  # Securely loaded from st.secrets["GEMINI_API_KEY"] or GEMINI_API_KEY env variable
  model: gemini-2.5-flash
  embedding_model: gemini-embedding-001
  max_output_tokens: 800
  temperature: 0.5

# Ollama Configuration (Local Offline)
ollama:
  base_url: http://localhost:11434
  model: llama3.1
  embedding_model: nomic-embed-text
  api_key: ollama

# ChromaDB Configuration
chromadb:
  persist_directory: ./chroma_db
  collection_name: email_context

# Email Retrieval Configuration
email:
  method: imap
  imap:
    server: imap.gmail.com
    port: 993
    use_ssl: true
  gmail_api:
    credentials_file: credentials.json
    token_file: token.json
    scopes:
      - https://www.googleapis.com/auth/gmail.readonly

# Telegram Bot Configuration
telegram:
  bot_token: ""  # Set your Telegram bot token here or via TELEGRAM_BOT_TOKEN
  enabled: false
  bot_username: "@BilEilbot"

# Generation Settings
generation:
  temperature: 0.5
  retry_count: 3
  delay: 0.05
  max_workers: 20
